[project]
name = "pebby"
version = "0.2.0"
description = "An agent that learns to complete ARC-AGI-3's LS20, trained on generated levels."
requires-python = ">=3.12,<3.15"
dependencies = [
    "torch>=2.14,<3",
    "numpy>=2,<3",
    "arcengine>=0.9.3",
    "model-microscope",
    "hostai==0.1.0",
    "arc-agi>=0.9.9",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cu130", marker = "sys_platform == 'linux'" }]
model-microscope = { path = "vendor/model_microscope-0.1.3-py3-none-any.whl" }
hostai = { path = "vendor/hostai-0.1.0-py3-none-any.whl" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[dependency-groups]
dev = [
    "pytest>=9,<10",
]
