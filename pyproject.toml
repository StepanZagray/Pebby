[project]
name = "pebby"
version = "0.2.0"
description = "A recurrent multi-game agent trained on generated ARC-AGI-3 games."
requires-python = ">=3.12,<3.15"
dependencies = [
    "torch>=2.14,<3",
    "numpy>=2,<3",
    "arcengine>=0.9.3",
    "arc-agi>=0.9.9",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cu130", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[dependency-groups]
dev = [
    "pytest>=9,<10",
]
