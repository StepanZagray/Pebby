<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pebby — generated level viewer</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="mark" aria-hidden="true">&#9638;</span>
    <h1>Pebby</h1>
    <p class="tagline">generated level viewer</p>
  </div>
  <div class="conn">
    <span id="transport" class="pill">connecting&hellip;</span>
    <span id="model" class="muted">&hellip;</span>
  </div>
</header>

<main class="layout">
  <section class="stage" aria-labelledby="stage-heading">
    <div class="stage-head">
      <h2 id="stage-heading"><span id="level-title">No level</span></h2>
      <span id="game-state" class="pill">&mdash;</span>
    </div>

    <div class="board-wrap">
      <canvas id="board" width="64" height="64" aria-describedby="board-summary"></canvas>
      <canvas id="board-overlay" class="board-overlay" aria-hidden="true"></canvas>
    </div>
    <p id="board-summary" class="sr-only" role="status"></p>

    <div class="stage-foot">
      <div class="toggles" role="group" aria-label="Overlays">
        <label class="toggle"><input type="checkbox" id="ov-lattice"> Lattice</label>
        <label class="toggle"><input type="checkbox" id="ov-features" checked> Features</label>
        <label class="toggle"><input type="checkbox" id="ov-route"> Route</label>
      </div>
      <p class="muted">64 &times; 64 &middot; ARC-AGI-3 palette &middot; <span id="action-count">0 actions</span></p>
    </div>

    <ul class="legend" aria-label="Overlay legend">
      <li><span class="key key-start" aria-hidden="true"></span>start</li>
      <li><span class="key key-goal" aria-hidden="true"></span>goal pad</li>
      <li><span class="key key-cycler" aria-hidden="true"></span>cycler</li>
      <li><span class="key key-launcher" aria-hidden="true"></span>launcher</li>
      <li><span class="key key-refill" aria-hidden="true"></span>refill</li>
      <li><span class="key key-route" aria-hidden="true"></span>solution route</li>
    </ul>
  </section>

  <aside class="rail">
    <section class="panel">
      <h2>Source</h2>
      <fieldset id="source-fields" disabled>
        <div class="field">
          <label for="seed">Seed</label>
          <input id="seed" type="number" min="0" max="4294967295" step="1" value="7" inputmode="numeric">
        </div>
        <div class="field">
          <label for="difficulty">Difficulty</label>
          <select id="difficulty"></select>
        </div>
        <div class="seed-row">
          <button id="prev-seed" type="button" class="step" aria-label="Previous seed">&#9664;</button>
          <button id="generate" type="button" class="primary">Generate</button>
          <button id="next-seed" type="button" class="step" aria-label="Next seed">&#9654;</button>
        </div>
        <button id="random-seed" type="button" class="wide">Random seed</button>
        <hr>
        <div class="field">
          <label for="shipped">Shipped</label>
          <select id="shipped"></select>
        </div>
        <button id="load-shipped" type="button" class="wide">Load shipped level</button>
      </fieldset>
      <p id="source-error" class="error" role="alert" hidden></p>
    </section>

    <section class="panel">
      <h2>Anatomy</h2>
      <dl class="facts" id="facts"></dl>
      <div id="features" class="features"></div>
    </section>

    <section class="panel">
      <h2>Solution</h2>
      <p id="solution-summary" class="muted">&mdash;</p>
      <input id="scrub" type="range" min="0" max="0" value="0" step="1" disabled aria-label="Solution step">
      <div class="btn-row">
        <button id="solution-play" type="button" disabled>Play solution</button>
        <button id="solution-end" type="button" disabled>Jump to end</button>
      </div>
      <p id="solution-note" class="muted"></p>
    </section>

    <section class="panel">
      <h2>Play</h2>
      <div class="dpad">
        <button type="button" class="pad up" data-action="1" aria-label="Up">&#8593;</button>
        <button type="button" class="pad left" data-action="3" aria-label="Left">&#8592;</button>
        <button type="button" class="pad right" data-action="4" aria-label="Right">&#8594;</button>
        <button type="button" class="pad down" data-action="2" aria-label="Down">&#8595;</button>
      </div>
      <div class="btn-row">
        <button id="undo" type="button">Undo</button>
        <button id="reset" type="button">Reset</button>
      </div>
      <p class="muted">Arrow keys work anywhere outside a field.</p>
    </section>

    <section class="panel">
      <h2>State</h2>
      <div class="token">
        <span id="carried-swatch" class="swatch" aria-hidden="true"></span>
        <span id="carried">&mdash;</span>
      </div>
      <ul id="goals" class="goals"></ul>
      <dl class="facts" id="live"></dl>
    </section>
  </aside>
</main>

<footer class="footer">
  <p id="status" class="muted">&hellip;</p>
</footer>

<script src="hostai-bridge.js"></script>
<script src="board.js"></script>
<script src="app.js"></script>
</body>
</html>
